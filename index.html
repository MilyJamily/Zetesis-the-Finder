<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zetesis the Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Canvas para a malha dinâmica com efeito de lupa no mouse -->
    <canvas id="gridCanvas"></canvas>
    <div class="fisheye-overlay"></div>

    <!-- TELA 1: Pesquisa Default -->
    <main class="default-container" id="searchScreen">
        <div class="logo-z">
            <svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 150" class="logo-svg">
                <g>
                    <circle cx="5.11" cy="118.89" r="5.11" fill="#00fff0"/>
                    <circle cx="114.13" cy="24.94" r="5.11" fill="#00fff0"/>
                    <polyline points="111.68 29.11 42.24 126.64 108.62 126.64 108.62 119.49 123.94 119.49 123.94 144 10.83 144 107.85 0 9.05 0 9.05 17.11 24.62 17.11 24.62 10.47 83.85 10.47 8.28 114.89" fill="#00fff0"/>
                </g>
            </svg>
        </div>

        <!-- Search Box com a frase e a lupa -->
        <div class="search-box">
            <input type="text" placeholder="Satisfy you curiosity..." id="searchInput">
            <button type="submit" id="searchBtn" aria-label="Search">
                <svg viewBox="0 0 24 24" class="search-icon">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="#00ffcc"/>
                </svg>
            </button>
        </div>
    </main>

    <!-- TELA 2: Resultados da Pesquisa -->
     <section class="results-page" id="resultsSection">
        <!-- Botão X fechar -->
        <button id="btn-reset-search" class="neon-back-btn" style="display: none;"> 
            <span class="icon">[ X ]</span> New Search
        </button>
        
        <!-- Linhas e título animado -->
     </section>

    <script src="app.js"></script>
</body>
</html>
